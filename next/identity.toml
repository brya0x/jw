# The ONE place the product's identity is defined. Every name, path, socket and
# env var in next/ is derived from this file through the `identity` crate.
# Swap day: change `name` from "jwn" to "jw" (and the Android ids) and nothing else.
name = "jwn"            # binary, state dir, config dir, socket file stem
env_prefix = "JWN"      # JWN_SOCKET, JWN_PANE_ID, ...
label = "jw next"       # human-facing name
android_application_id = "dev.jw.next"  # unused until the Android phase
tunnel_program = "cloudflared"
pairing_store = "mobile.json"           # file in the config dir
