# The ONE place the product's identity is defined. The name, the env prefix, the paths, the
# socket, the phone's pairing scheme and the peer names on the wire are derived from this file
# through the `identity` crate. Four things are literal and must follow it by hand, and a test
# for each stops them from drifting: the binary name in `crates/jw/Cargo.toml`, the env names
# the shell integration reads (`crates/daemon/shell`), the file name `fish/jw.fish`, and
# `android_application_id` here (changing it installs a different app on the phone).
name = "jw"             # binary, state dir, config dir, socket file stem
env_prefix = "JW"       # JW_SOCKET, JW_PANE_ID, ...
label = "jw"            # human-facing name
android_application_id = "dev.jw.next"  # unchanged by the swap: a new id is a different app on the phone
tunnel_program = "cloudflared"
pairing_store = "mobile.json"           # file in the state dir
repo = "https://github.com/brya0x/jw"  # what `update` and `android install` fetch (https only)
agent_skill = "agent"                  # the skill of the roles: /agent (claude has a /agents of its own)
