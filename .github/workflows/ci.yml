name: CI

# Tests run on the PR, before it can be merged; main isn't tested again.
on:
  pull_request:

permissions:
  contents: read

# A new push to the same PR cancels the run still going for the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # jw is unix only, like its runtime: PTYs and a unix socket. Both
  # flavours: the git tests behave slightly differently on macOS
  # (/var → /private/var, BSD tools).
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v3

      - name: just fmt-check
        if: runner.os == 'Linux'
        run: just fmt-check

      - name: just clippy
        run: just clippy

      - name: just test
        run: just test

  # The Android app. Runs only when something it builds from changed (the app,
  # the wire protocol it mirrors, the recipes, this file); a skipped job counts
  # as passing for a required check.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            android:
              - 'android/**'
              - 'crates/proto/**'
              - 'justfile'
              - '.github/workflows/ci.yml'

  android:
    name: android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # Installs the Android SDK and licenses on the runner; Gradle fetches the
      # platform and build tools the project asks for.
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v5
        with:
          # Only main writes the cache; PRs read it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: extractions/setup-just@v3

      - name: just android
        run: just android
