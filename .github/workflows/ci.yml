name: CI

# Tests run on the PR, before it can be merged; main isn't tested again.
on:
  pull_request:

permissions:
  contents: read

# A new push to the same PR cancels the run still going for the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # jw is unix only, like its runtime: PTYs and a unix socket. Both
  # flavours: the git tests behave slightly differently on macOS
  # (/var → /private/var, BSD tools).
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked
