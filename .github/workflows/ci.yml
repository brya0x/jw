name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR cancels the run still going for the old one.
# On main nothing is cancelled: every merge gets its own complete run, even
# when two land back to back.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Both Unix flavours: the system connector and the git tests behave
        # slightly differently on macOS (/var → /private/var, BSD tools).
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "run gofmt -w on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

  # The Windows side of the system connector must keep compiling. The test
  # suite itself uses sh scripts as fake tools, so it only runs on Unix.
  windows:
    name: build (windows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: go vet (GOOS=windows)
        run: GOOS=windows go vet ./...

      - name: go build (GOOS=windows)
        run: GOOS=windows go build -o /dev/null .
