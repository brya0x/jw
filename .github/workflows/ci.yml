name: ci

# The recipes of the justfile, the same ones `just ci` runs locally.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR cancels the run still going for the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The daemon owns PTYs and a unix socket, so both flavours run: the tests start real zsh,
  # bash and fish, and a shell that is not installed is skipped, so they are installed.
  rust:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v3

      - name: shells for the tests (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish

      - name: shells for the tests (macOS)
        if: runner.os == 'macOS'
        run: brew install fish

      - name: just fmt-check
        if: runner.os == 'Linux'
        run: just fmt-check

      - name: just clippy
        run: just clippy

      - name: just test
        run: just test

  # The Kotlin side: the contract suite on the shared fixtures, the client logic, and the
  # Compose app built and linted.
  android:
    name: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # Installs the Android SDK and licenses on the runner; Gradle fetches the
      # platform and build tools the project asks for.
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v5
        with:
          # Only main writes the cache; PRs read it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: extractions/setup-just@v3

      - name: just android-check
        run: just android-check
