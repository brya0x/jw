[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.2"
edition = "2024"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
jw-core = { path = "crates/core" }
jw-proto = { path = "crates/proto" }
jw-daemon = { path = "crates/daemon" }
jw-tui = { path = "crates/tui" }
anyhow = "1.0.104"
libc = "0.2.190"
portable-pty = "0.9.0"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "parsing", "regex-fancy"] }
tempfile = "3.27.0"
toml = "1.1.7"
unicode-width = "0.2"
vt100 = "0.16.2"
