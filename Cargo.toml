[package]
name = "jw"
version = "0.0.0"
edition = "2024"
license-file = "LICENSE"
description = "Worktree streams in a TUI that is its own terminal multiplexer"
publish = false

# The Rust rewrite lives next to the Go code until it reaches parity;
# see docs/specs/rust-tui.md.
[[bin]]
name = "jw"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.7"

[dev-dependencies]
tempfile = "3.27.0"
